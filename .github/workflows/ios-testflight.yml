name: iOS app to TestFlight

# Builds the Kainlee iOS app (mobile/) on a GitHub Mac and uploads it to TestFlight.
# Start it: GitHub › Actions › "iOS app to TestFlight" › Run workflow
#           (or push to the "testflight" branch, or push a tag like ios-v1.0.1).
# Needs these repository secrets (Settings › Secrets and variables › Actions):
#   APPLE_TEAM_ID        10-character Team ID (developer.apple.com › Account › Membership)
#   APPSTORE_KEY_ID      App Store Connect API key ID (Users and Access › Integrations › Team Keys, access: Admin)
#   APPSTORE_ISSUER_ID   Issuer ID shown above that key list
#   APPSTORE_KEY_P8      the whole text of the downloaded AuthKey_XXXX.p8 file
# Signing is done by Apple (cloud-managed certificate), so no certificates or profiles are stored here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version shown in the App Store (leave as is unless releasing a new version)"
        required: false
        default: ""
  push:
    branches: [testflight]
    tags: ["ios-v*"]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the Apple secrets are set
        run: |
          missing=""
          for v in APPLE_TEAM_ID APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_KEY_P8; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Missing secrets::Only checking that the app builds. To upload to TestFlight add these in GitHub › Settings › Secrets and variables › Actions:$missing"
            echo "HAVE_SECRETS=no" >> "$GITHUB_ENV"
          else
            echo "All four Apple secrets are present."
            echo "HAVE_SECRETS=yes" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Install and prepare the iOS project
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios

      - name: App Store Connect key
        if: env.HAVE_SECRETS == 'yes'
        run: |
          mkdir -p "$HOME/private_keys"
          KEY="$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s\n' "$APPSTORE_KEY_P8" | sed 's/\\n/\n/g' > "$KEY"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY"; then
            echo "::error title=Bad key::APPSTORE_KEY_P8 must contain the whole .p8 file, including the BEGIN/END PRIVATE KEY lines."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [[ "$GITHUB_REF_NAME" == ios-v* ]]; then V="${GITHUB_REF_NAME#ios-v}"; fi
          echo "APP_VERSION=${V:-1.0.0}" >> "$GITHUB_ENV"

      - name: Check the App Store Connect key with Apple
        if: env.HAVE_SECRETS == 'yes'
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet --user pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, re
          import jwt
          kid = os.environ["APPSTORE_KEY_ID"].strip()
          iss = os.environ["APPSTORE_ISSUER_ID"].strip()
          key = open(os.environ["ASC_KEY_PATH"]).read()
          def note(level, title, msg): print(f"::{level} title={title}::{msg}")
          if not re.fullmatch(r"[A-Z0-9]{10}", kid): note("warning", "Key ID format", f"APPSTORE_KEY_ID should be 10 capital letters/numbers; it has {len(kid)} characters.")
          if not re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", iss): note("warning", "Issuer ID format", f"APPSTORE_ISSUER_ID should look like 69a6de7e-xxxx-xxxx-xxxx-xxxxxxxxxxxx; it has {len(iss)} characters.")
          if os.environ["APPLE_TEAM_ID"].strip() != os.environ["APPLE_TEAM_ID"] or not re.fullmatch(r"[A-Z0-9]{10}", os.environ["APPLE_TEAM_ID"].strip()): note("warning", "Team ID format", "APPLE_TEAM_ID should be exactly 10 capital letters/numbers with no spaces.")
          try:
              tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          except Exception as e:
              note("error", "Key file", f"APPSTORE_KEY_P8 could not be read as an Apple key ({type(e).__name__}). Paste the whole .p8 file again."); raise SystemExit(1)
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.makjal.kainlee&fields[apps]=name,bundleId", headers={"Authorization": f"Bearer {tok}"})
          try:
              data = json.load(urllib.request.urlopen(req, timeout=30))
              apps = [a["attributes"]["name"] for a in data.get("data", [])]
              note("notice", "Key works", f"Apple accepted the key. App found: {apps or 'none (create the app in App Store Connect)'}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()[:400]
              hint = {401: "Apple rejected the key: Key ID, Issuer ID or .p8 text does not match (or the key was revoked).", 403: "The key works but lacks permission: generate a Team Key with Admin access."}.get(e.code, "")
              note("error", f"Apple said {e.code}", f"{hint} {body}"); raise SystemExit(1)
          PY

      - name: Build check only (no Apple secrets yet)
        if: env.HAVE_SECRETS != 'yes'
        working-directory: mobile/ios/App
        run: |
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Kainlee.xcarchive" CODE_SIGNING_ALLOWED=NO | tee check.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" check.log || { grep -hE "error:" check.log | sort -u | head -8 | sed "s/^/::error title=Build failed::/"; exit 1; }
          echo "::notice title=Build check passed::The app builds. Add the four Apple secrets to upload to TestFlight."

      - name: Create signing certificate and profile (App Store Connect API)
        if: env.HAVE_SECRETS == 'yes'
        env:
          BUNDLE_ID: com.makjal.kainlee
        run: |
          python3 mobile/ci/asc_signing.py setup

      - name: Install signing into a temporary keychain
        if: env.HAVE_SECRETS == 'yes'
        run: |
          KC="$RUNNER_TEMP/kainlee.keychain-db"
          KCPW=$(openssl rand -hex 16)
          echo "::add-mask::$KCPW"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer && \
            security import "$RUNNER_TEMP/wwdr.cer" -k "$KC" -A >/dev/null 2>&1 || true
          security import "$SIGN_P12" -P "$SIGN_P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          # the team that owns the profile is the one to sign with (more reliable than a typed Team ID)
          PROFILE_FILE=~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          TEAM=$(security cms -D -i "$PROFILE_FILE" | plutil -extract TeamIdentifier.0 raw -)
          if [ "$TEAM" != "$(echo "$APPLE_TEAM_ID" | tr -d '[:space:]')" ]; then
            echo "::warning title=Team ID::The APPLE_TEAM_ID secret does not match your Apple team ($TEAM). Using $TEAM. You can update the secret to $TEAM."
          fi
          echo "APPLE_TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          APPLE_TEAM_ID=$TEAM
          # sign only the app target (not the Swift packages) with the App Store profile
          PBX=mobile/ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\"; PROVISIONING_PROFILE = \"$PROFILE_UUID\"; DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/" "$PBX"
          grep -c "PROVISIONING_PROFILE_SPECIFIER" "$PBX"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>/dev/null
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision | plutil -extract Name raw - | sed "s/^/::notice title=Profile installed::/"

      - name: Build the app (archive)
        if: env.HAVE_SECRETS == 'yes'
        working-directory: mobile/ios/App
        run: |
          APP_VERSION="${APP_VERSION:-1.0.0}"
          echo "Version $APP_VERSION, build $BUILD_NUMBER"
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Kainlee.xcarchive" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGN_KEYCHAIN" | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log || { grep -hE "error:" archive.log | sort -u | head -8 | sed "s/^/::error title=Build failed::/"; exit 1; }

      - name: Sign for the App Store (export)
        if: env.HAVE_SECRETS == 'yes'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.makjal.kainlee</key><string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kainlee.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" 2>&1 | tee export.log
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            grep -hiE "error|failed" export.log | sort -u | head -10 | sed "s/^/::error title=Export failed::/"
            exit 1
          fi
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          unzip -q -o "$IPA" -d "$RUNNER_TEMP/ipa" && codesign -d --entitlements - --xml "$RUNNER_TEMP/ipa/Payload/App.app" 2>/dev/null | grep -o "aps-environment</key><string>[a-z]*" | sed "s/^/::notice title=Push entitlement::/" || true

      - name: Upload to TestFlight
        if: env.HAVE_SECRETS == 'yes'
        run: |
          set +e
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID" 2>&1 | tee upload.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "0" ] && ! grep -qiE "^ERROR|error:" upload.log; then
            echo "::notice title=Uploaded::Version ${APP_VERSION:-1.0.0} ($BUILD_NUMBER) uploaded. It appears in App Store Connect › TestFlight after Apple finishes processing (usually 10–30 minutes)."
          else
            grep -hiE "error|failed|invalid|missing" upload.log | sort -u | head -12 | sed "s/^/::error title=Upload failed::/"
            exit 1
          fi

      - name: Revoke the temporary certificate and profile
        if: always() && env.HAVE_SECRETS == 'yes'
        run: |
          python3 mobile/ci/asc_signing.py cleanup || true
          [ -n "$SIGN_KEYCHAIN" ] && security delete-keychain "$SIGN_KEYCHAIN" || true

      - name: Remove the key
        if: always()
        run: rm -rf "$HOME/private_keys"
