<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kainlee</title>
<style>
  html,body{height:100%;margin:0}
  body{background:linear-gradient(145deg,#12935a,#00572D 45%,#003a1e);font:16px/1.45 -apple-system,system-ui,sans-serif;color:#f4f1e8;
    padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));box-sizing:border-box}
  .r{height:100%;box-sizing:border-box;padding:7px;border-radius:38px;background:linear-gradient(145deg,#ff7070,#FF2828 45%,#bf1010)}
  .g{height:100%;box-sizing:border-box;padding:8px;border-radius:32px;background:linear-gradient(145deg,#12935a,#00572D 45%,#003a1e)}
  .p{height:100%;border-radius:25px;background:radial-gradient(120% 55% at 50% 0%,#14774a,#0a4a2c 42%,#04281a 75%,#021810);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;box-sizing:border-box}
  img{width:112px;height:112px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
  h1{font:700 30px Georgia,serif;margin:0}
  p{margin:0;color:#b7c9bd;max-width:300px}
  button{font:700 17px -apple-system,system-ui,sans-serif;color:#fff;border:0;border-radius:14px;padding:14px 28px;min-height:50px;
    background:linear-gradient(135deg,#ff9a5c,#FF2828 45%,#c3101a);box-shadow:0 10px 24px -8px rgba(255,70,40,.6)}
</style>
</head>
<body>
<div class="r"><div class="g"><main class="p">
  <img src="crest.png" alt="">
  <h1>No connection</h1>
  <p>Kainlee needs the internet to load the latest guest list. Check Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="location.href='https://momopasal.in/admin'">Try again</button>
</main></div></div>
</body>
</html>
